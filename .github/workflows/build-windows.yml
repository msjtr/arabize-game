name: Build Windows (Arabize Game)
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["site/**", ".github/workflows/pages.yml", "tests/site_test.py", "*.md"]
  workflow_dispatch:
permissions:
  contents: write          # needed only to attach the zip to a release when a v* tag is pushed
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Tests on real Windows (core, engines, OCR, looks, Windows-only features)
        run: python -m pytest -q tests/test_core.py tests/test_ocr.py tests/test_looks.py tests/test_render.py tests/test_windows.py
      - name: Build exe
        run: pyinstaller --noconfirm ArabizeGame.spec
      - name: Smoke test the built app and photograph it
        shell: pwsh
        run: |
          $p = Start-Process dist/ArabizeGame/ArabizeGame.exe -PassThru
          Start-Sleep -Seconds 18
          if ($p.HasExited) { Write-Error "App exited early with code $($p.ExitCode)"; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          $bmp.Save("shots/windows-app.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id -Force
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/ArabizeGame -DestinationPath ArabizeGame-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ArabizeGame-windows
          path: ArabizeGame-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-screenshot
          path: shots
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ArabizeGame-Windows.zip
          name: "عرب لعبتك | Arabize Game ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
